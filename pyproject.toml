[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermi"
readme = "README.md"
version = "0.1.0"
description = "A Python package for computing integrals over atom-centred Gaussian basis functions for use in quantum chemistry"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1.0",
    "scipy>=1.12.0",
    "basis-set-exchange>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.18.0",
    "ruff>=0.14.0",
    "scipy-stubs>=1.0.0",
    "pyscf>=2.0.0",
    "typing-extensions>=4.9.0",
]

[tool.setuptools.packages.find]
include = ["hermi*"]

[tool.setuptools.package-data]
"hermi.systems" = ["periodic_table.json"]

[tool.ruff]
line-length = 120
target-version = "py312"
include = ["pyproject.toml", "hermi/**/*.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "PL"]
ignore = [
    "D105",
    "D107",
    "E741",
    "PLC0414",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLR5501",
    "PLW1641",
    "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"hermi/__init__.py" = [
    "D205",  # missing-blank-line-after-summary
    "D212",  # multi-line-summary-first-line
    "D415",  # missing-terminal-punctuation
]
"hermi/**/__init__.py" = [
    "I001",  # unsorted-imports
    "F401",  # unused-import
]
"tests/**/*.py" = [
    "D100",  # missing-docstring-in-public-module
    "D101",  # missing-docstring-in-public-class
    "D102",  # missing-docstring-in-public-function
    "D103",  # undocumented-public-function
    "D104",  # undocumented-public-package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["hermi"]

[tool.mypy]
python_version = "3.12"
strict = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["basis_set_exchange.*", "numba.*"]
ignore_missing_imports = true
